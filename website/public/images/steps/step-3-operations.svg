<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-grad-3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="green-pill-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow-3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg-grad-3)"/>

  <!-- Subtle Grid Lines -->
  <path d="M0 80 H640 M0 160 H640 M0 240 H640 M0 320 H640" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>

  <g filter="url(#shadow-3)">
    <rect x="70" y="45" width="500" height="310" rx="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>

    <!-- App Header Bar -->
    <rect x="70" y="45" width="500" height="46" rx="20" fill="#FAF5FF"/>
    <rect x="70" y="71" width="500" height="20" fill="#FAF5FF"/>
    <line x1="70" y1="91" x2="570" y2="91" stroke="#EDE9FE" stroke-width="1"/>

    <!-- Window dots -->
    <circle cx="102" cy="68" r="5" fill="#FDA4AF"/>
    <circle cx="120" cy="68" r="5" fill="#FCD34D"/>
    <circle cx="138" cy="68" r="5" fill="#86EFAC"/>

    <text x="320" y="72" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Live Front Desk: Appointment Schedule &amp; Express POS
    </text>

    <!-- Left Column: Appointment Calendar Block -->
    <g transform="translate(95, 108)">
      <rect x="0" y="0" width="220" height="184" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      
      <rect x="12" y="12" width="196" height="26" rx="8" fill="#EDE9FE"/>
      <text x="24" y="29" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="11" font-weight="700">📅 Today • 8 Appointments</text>

      <!-- Slot 1 -->
      <g transform="translate(12, 48)">
        <rect x="0" y="0" width="196" height="56" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
        <rect x="0" y="0" width="5" height="56" rx="2" fill="#7C3AED"/>
        <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">10:00 AM • Sophia Miller</text>
        <text x="14" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Balayage &amp; Silk Gloss (Elena)</text>
        <rect x="136" y="10" width="50" height="16" rx="8" fill="#DCFCE7"/>
        <text x="161" y="21" fill="#166534" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Confirmed</text>
      </g>

      <!-- Slot 2 -->
      <g transform="translate(12, 114)">
        <rect x="0" y="0" width="196" height="56" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
        <rect x="0" y="0" width="5" height="56" rx="2" fill="#A855F7"/>
        <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">11:30 AM • James Davis</text>
        <text x="14" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Precision Fade &amp; Beard (Marcus)</text>
        <rect x="136" y="10" width="50" height="16" rx="8" fill="#FEF3C7"/>
        <text x="161" y="21" fill="#92400E" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">In-Chair</text>
      </g>
    </g>

    <!-- Right Column: Express Station POS -->
    <g transform="translate(325, 108)">
      <rect x="0" y="0" width="220" height="184" rx="14" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>

      <text x="16" y="28" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Station POS #01</text>
      <rect x="136" y="14" width="70" height="20" rx="10" fill="#EDE9FE"/>
      <text x="171" y="28" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Sub-5s Checkout</text>

      <!-- Itemized lines -->
      <g transform="translate(16, 48)">
        <text x="0" y="12" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Hair Styling + Gloss</text>
        <text x="188" y="12" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">$165.00</text>

        <text x="0" y="30" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Moroccan Argan Serum</text>
        <text x="188" y="30" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">$35.00</text>

        <line x1="0" y1="40" x2="188" y2="40" stroke="#DDD6FE" stroke-width="1"/>

        <text x="0" y="58" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Total Due</text>
        <text x="188" y="58" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">$200.00</text>
      </g>

      <!-- Split Payment Badges -->
      <g transform="translate(16, 126)">
        <rect x="0" y="0" width="88" height="24" rx="8" fill="#EDE9FE"/>
        <text x="44" y="16" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Card: $100</text>

        <rect x="98" y="0" width="88" height="24" rx="8" fill="#EDE9FE"/>
        <text x="142" y="16" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Cash: $100</text>
      </g>

      <rect x="16" y="156" width="188" height="20" rx="10" fill="url(#green-pill-3)"/>
      <text x="110" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">
        ✓ Thermal Receipt &amp; SMS Sent
      </text>
    </g>

    <!-- Bottom summary -->
    <g transform="translate(95, 304)">
      <circle cx="10" cy="10" r="8" fill="#DCFCE7"/>
      <text x="10" y="14" fill="#16A34A" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text x="26" y="14" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Zero double-booking conflicts • Split billing &amp; thermal printer sync</text>
    </g>
  </g>
</svg>
