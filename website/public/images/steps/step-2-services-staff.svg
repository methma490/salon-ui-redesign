<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="purple-badge-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="shadow-2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg-grad-2)"/>

  <!-- Subtle Grid Lines -->
  <path d="M0 80 H640 M0 160 H640 M0 240 H640 M0 320 H640" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>

  <g filter="url(#shadow-2)">
    <rect x="70" y="45" width="500" height="310" rx="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>

    <!-- App Header Bar -->
    <rect x="70" y="45" width="500" height="46" rx="20" fill="#FAF5FF"/>
    <rect x="70" y="71" width="500" height="20" fill="#FAF5FF"/>
    <line x1="70" y1="91" x2="570" y2="91" stroke="#EDE9FE" stroke-width="1"/>

    <!-- Window dots -->
    <circle cx="102" cy="68" r="5" fill="#FDA4AF"/>
    <circle cx="120" cy="68" r="5" fill="#FCD34D"/>
    <circle cx="138" cy="68" r="5" fill="#86EFAC"/>

    <text x="320" y="72" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Catalog &amp; Team Management Configuration
    </text>

    <!-- Top Section: Stylist Team Member -->
    <g transform="translate(95, 108)">
      <rect x="0" y="0" width="450" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      
      <!-- Avatar with Online Dot -->
      <circle cx="42" cy="42" r="22" fill="#EDE9FE"/>
      <text x="42" y="48" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">ER</text>
      <circle cx="58" cy="56" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

      <text x="76" y="34" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Elena Rostova</text>
      <rect x="175" y="21" width="94" height="18" rx="9" fill="#EDE9FE"/>
      <text x="222" y="34" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Master Colorist</text>

      <text x="76" y="58" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">Station 02 • Senior Tier</text>

      <!-- Commission Tag -->
      <rect x="330" y="26" width="105" height="32" rx="10" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
      <text x="382" y="46" fill="#166534" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">15% Commission</text>
    </g>

    <!-- Bottom Section: Service Menu Item -->
    <g transform="translate(95, 206)">
      <rect x="0" y="0" width="450" height="84" rx="14" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>

      <!-- Scissors / Service Icon Box -->
      <rect x="18" y="18" width="48" height="48" rx="12" fill="#EDE9FE"/>
      <text x="42" y="48" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">✂️</text>

      <text x="78" y="34" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Balayage &amp; Silk Gloss Treatment</text>
      <text x="78" y="58" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">⏱️ 90 mins • 15 min buffer • Color Bar Supplies</text>

      <!-- Price Pill -->
      <rect x="350" y="26" width="85" height="32" rx="10" fill="url(#purple-badge-2)"/>
      <text x="392" y="46" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">$165.00</text>
    </g>

    <!-- Bottom Confirmation Bar -->
    <g transform="translate(95, 304)">
      <circle cx="10" cy="10" r="8" fill="#DCFCE7"/>
      <text x="10" y="14" fill="#16A34A" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓</text>
      <text x="26" y="14" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Auto-assigned stylist commission math &amp; duration buffer rules</text>
    </g>
  </g>
</svg>
