<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="purple-btn-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="badge-grad-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow-1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg-grad-1)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 80 H640 M0 160 H640 M0 240 H640 M0 320 H640" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>
  <path d="M120 0 V400 M240 0 V400 M360 0 V400 M480 0 V400" stroke="#DDD6FE" stroke-width="1" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Main Card Container -->
  <g filter="url(#shadow-1)">
    <rect x="70" y="45" width="500" height="310" rx="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>

    <!-- App Header Bar -->
    <rect x="70" y="45" width="500" height="48" rx="20" fill="#FAF5FF"/>
    <rect x="70" y="73" width="500" height="20" fill="#FAF5FF"/>
    <line x1="70" y1="93" x2="570" y2="93" stroke="#EDE9FE" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="102" cy="69" r="5" fill="#FDA4AF"/>
    <circle cx="120" cy="69" r="5" fill="#FCD34D"/>
    <circle cx="138" cy="69" r="5" fill="#86EFAC"/>

    <!-- Header Title -->
    <text x="320" y="73" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Dart Smart Salon • Fast Workspace Setup
    </text>

    <!-- Trial Pill Tag -->
    <rect x="420" y="58" width="132" height="22" rx="11" fill="#DCFCE7"/>
    <circle cx="432" cy="69" r="3.5" fill="#16A34A"/>
    <text x="444" y="73" fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="700">21-Day Free Trial</text>

    <!-- Form Field 1: Salon Name -->
    <g transform="translate(100, 115)">
      <text x="0" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Salon Name</text>
      <rect x="0" y="18" width="440" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="14" y="42" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Aurelia Luxury Hair &amp; Spa</text>
      <text x="420" y="42" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">✓</text>
    </g>

    <!-- Form Field 2: Select Salon Type & Stylists -->
    <g transform="translate(100, 185)">
      <g>
        <text x="0" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Salon Category</text>
        <rect x="0" y="18" width="210" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
        <text x="14" y="42" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Hair, Nails &amp; Spa</text>
        <path d="M190 38 L195 44 L200 38" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(230, 0)">
        <text x="0" y="10" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Initial Stylist Seats</text>
        <rect x="0" y="18" width="210" height="38" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
        <text x="14" y="42" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="500">1 – 10 Stations</text>
        <path d="M190 38 L195 44 L200 38" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Action Button -->
    <rect x="100" y="260" width="440" height="42" rx="12" fill="url(#purple-btn-1)"/>
    <text x="320" y="286" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      Create Workspace &amp; Start 21-Day Trial →
    </text>

    <!-- Footer Guarantee -->
    <text x="320" y="325" fill="#64748B" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">
      🔒 Zero credit card upfront • Full access to POS, Calendar &amp; Staff Rosters
    </text>
  </g>
</svg>
