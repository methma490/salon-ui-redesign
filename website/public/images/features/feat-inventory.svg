<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#inv-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>

  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Inventory Control • Retail Shelf &amp; Back-Bar Color Consumption</text>

  <!-- Stock Item 1: Low stock alert -->
  <g transform="translate(75, 96)">
    <rect width="490" height="68" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.2"/>
    <text x="18" y="28" fill="#991B1B" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Moroccanoil Treatment Original 100ml</text>
    <rect x="300" y="14" width="75" height="18" rx="9" fill="#FEE2E2"/>
    <text x="337" y="27" fill="#B91C1C" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Retail Stock</text>
    <text x="18" y="50" fill="#7F1D1D" font-family="system-ui, sans-serif" font-size="10">Barcode: #849102 • Supplier: L'Oréal Pro • Cost: $18.00 / Retail: $38.00</text>
    <rect x="390" y="20" width="85" height="26" rx="8" fill="#DC2626"/>
    <text x="432" y="37" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">⚠️ Only 2 Left</text>
  </g>

  <!-- Stock Item 2: Back-bar Color Tube -->
  <g transform="translate(75, 174)">
    <rect width="490" height="68" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="18" y="28" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Wella Koleston Perfect 7/1 Ash Blonde</text>
    <rect x="290" y="14" width="85" height="18" rx="9" fill="#EDE9FE"/>
    <text x="332" y="27" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Internal Back-Bar</text>
    <text x="18" y="50" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Auto-deducted per balayage service formula (60g per bowl)</text>
    <text x="470" y="42" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">18 Tubes</text>
  </g>

  <!-- Stock Item 3: Shampoo bulk -->
  <g transform="translate(75, 252)">
    <rect width="490" height="68" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="18" y="28" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Olaplex No. 4 Bond Maintenance Shampoo (1000ml)</text>
    <rect x="370" y="14" width="95" height="18" rx="9" fill="#DCFCE7"/>
    <text x="417" y="27" fill="#166534" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Wash Station Bar</text>
    <text x="18" y="50" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Current Fill: 75% • Reorder threshold: 25%</text>
    <text x="470" y="42" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">In Stock</text>
  </g>

  <g transform="translate(75, 332)">
    <text x="0" y="12" fill="#10B981" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">✓ Auto-alerts trigger purchase orders before back-bar or retail shelves run empty</text>
  </g>
</svg>
