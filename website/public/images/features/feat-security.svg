<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sec-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#sec-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>

  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Audit Trails &amp; Enterprise Cloud Security</text>

  <!-- Security Status Banner -->
  <g transform="translate(75, 96)">
    <rect width="490" height="64" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <circle cx="36" cy="32" r="18" fill="#EDE9FE"/>
    <text x="36" y="38" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">🛡️</text>

    <text x="68" y="26" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Bank-Grade Cloud Encryption Active (AES-256)</text>
    <text x="68" y="46" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Dedicated Tenant Isolation • Automated Daily Encrypted Cloud Backups</text>

    <rect x="385" y="18" width="90" height="26" rx="8" fill="#DCFCE7"/>
    <text x="430" y="34" fill="#166534" font-family="system-ui, sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">🔒 Certified Safe</text>
  </g>

  <!-- Tamper-Proof Audit Trail Table -->
  <g transform="translate(75, 172)">
    <rect width="490" height="148" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="22" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Tamper-Proof Salon Activity Audit Log</text>

    <!-- Log Row 1 -->
    <g transform="translate(18, 34)">
      <text x="0" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">14:22:10</text>
      <text x="75" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Chloe L. (Cashier)</text>
      <text x="210" y="16" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="10">Issued thermal receipt #2041 ($225.00)</text>
      <text x="450" y="16" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="end">SUCCESS</text>
      <line x1="0" y1="24" x2="450" y2="24" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Log Row 2 -->
    <g transform="translate(18, 64)">
      <text x="0" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">13:45:02</text>
      <text x="75" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Elena R. (Stylist)</text>
      <text x="210" y="16" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="10">Updated client treatment formula note (Sophia M.)</text>
      <text x="450" y="16" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="end">LOGGED</text>
      <line x1="0" y1="24" x2="450" y2="24" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- Log Row 3 -->
    <g transform="translate(18, 94)">
      <text x="0" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">12:00:18</text>
      <text x="75" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Admin (Manager)</text>
      <text x="210" y="16" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="10">Modified holiday schedule &amp; stylist roster</text>
      <text x="450" y="16" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="end">AUTHENTICATED</text>
    </g>
  </g>

  <g transform="translate(75, 334)">
    <text x="0" y="10" fill="#10B981" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">✓ Every financial edit, price override, and stock adjustment is logged with audit proof</text>
  </g>
