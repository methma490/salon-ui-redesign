<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="db-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="db-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#db-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>
  
  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Salon Live Executive Dashboard</text>

  <!-- Metric 1 -->
  <g transform="translate(75, 100)">
    <rect width="145" height="70" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="14" y="22" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Today's Revenue</text>
    <text x="14" y="46" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="800">$3,840</text>
    <text x="14" y="61" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700">↑ 18% vs Yesterday</text>
  </g>

  <!-- Metric 2 -->
  <g transform="translate(245, 100)">
    <rect width="145" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="22" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Active Bookings</text>
    <text x="14" y="46" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="18" font-weight="800">28 Slots</text>
    <text x="14" y="61" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="9" font-weight="700">92% Chair Capacity</text>
  </g>

  <!-- Metric 3 -->
  <g transform="translate(415, 100)">
    <rect width="150" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="22" fill="#64748B" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Net Profit Margin</text>
    <text x="14" y="46" fill="#0F172A" font-family="system-ui, sans-serif" font-size="18" font-weight="800">43.5%</text>
    <text x="14" y="61" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ Commission Deducted</text>
  </g>

  <!-- Bar Chart Simulation -->
  <g transform="translate(75, 190)">
    <rect width="490" height="150" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Hourly Salon Sales &amp; Staff Productivity</text>
    
    <!-- 7 Hourly Bars -->
    <rect x="40" y="90" width="34" height="40" rx="6" fill="#DDD6FE"/>
    <text x="57" y="142" fill="#64748B" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">10 AM</text>

    <rect x="100" y="60" width="34" height="70" rx="6" fill="#A855F7"/>
    <text x="117" y="142" fill="#64748B" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">12 PM</text>

    <rect x="160" y="45" width="34" height="85" rx="6" fill="url(#db-bar)"/>
    <text x="177" y="142" fill="#64748B" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">2 PM</text>

    <rect x="220" y="35" width="34" height="95" rx="6" fill="url(#db-bar)"/>
    <text x="237" y="142" fill="#64748B" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">4 PM</text>

    <rect x="280" y="55" width="34" height="75" rx="6" fill="#A855F7"/>
    <text x="297" y="142" fill="#64748B" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">6 PM</text>

    <rect x="340" y="80" width="34" height="50" rx="6" fill="#DDD6FE"/>
    <text x="357" y="142" fill="#64748B" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">8 PM</text>

    <!-- Legend -->
    <rect x="400" y="50" width="70" height="20" rx="10" fill="#DCFCE7"/>
    <text x="435" y="63" fill="#166534" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Peak Hour</text>
  </g>
</svg>
