<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="pay-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#pay-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>

  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Staff Payroll &amp; Automated Commission Breakdown</text>

  <!-- Payroll Summary Header -->
  <g transform="translate(75, 100)">
    <rect width="490" height="70" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="18" y="24" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Monthly Commission Summary (October 2026)</text>

    <g transform="translate(18, 38)">
      <text x="0" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Base Salary Pool: $8,500</text>
      <text x="150" y="16" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Service Commission: $4,240</text>
      <text x="320" y="16" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Retail Commission: $980</text>
    </g>
  </g>

  <!-- Stylist Payslip Row 1 -->
  <g transform="translate(75, 185)">
    <rect width="490" height="64" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Elena Rostova</text>
    <text x="18" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Services: $8,400 (15%) = $1,260 • Products: $800 (10%) = $80 • Advance: -$100</text>
    
    <text x="470" y="38" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="end">$2,440.00</text>
  </g>

  <!-- Stylist Payslip Row 2 -->
  <g transform="translate(75, 260)">
    <rect width="490" height="64" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="18" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Marcus Thorne</text>
    <text x="18" y="44" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Services: $5,200 (12%) = $624 • Products: $450 (10%) = $45 • Advance: $0</text>

    <text x="470" y="38" fill="#0F172A" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="end">$1,869.00</text>
  </g>

  <g transform="translate(75, 336)">
    <text x="0" y="10" fill="#10B981" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">✓ One-click automated monthly payslip PDF export &amp; direct payout tracking</text>
  </g>
</svg>
