<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="wa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#wa-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>

  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">WhatsApp &amp; SMS Automated Notification Engine</text>

  <!-- Phone Mockup Container in Center -->
  <g transform="translate(130, 95)">
    <rect width="380" height="210" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.2"/>
    
    <!-- WhatsApp Header -->
    <rect width="380" height="42" rx="16" fill="#15803D"/>
    <rect y="26" width="380" height="16" fill="#15803D"/>
    <circle cx="28" cy="21" r="12" fill="#FFFFFF"/>
    <text x="28" y="26" fill="#15803D" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">✂️</text>
    <text x="50" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Aurelia Salon Verified (WhatsApp Business)</text>

    <!-- Message Bubble 1: Automated Reminder -->
    <g transform="translate(20, 56)">
      <rect width="300" height="74" rx="12" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="1"/>
      <text x="14" y="20" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Hi Sophia! ✨ Reminder from Aurelia Salon:</text>
      <text x="14" y="38" fill="#334155" font-family="system-ui, sans-serif" font-size="10">Your appointment is scheduled for tomorrow at 10:00 AM with Master Stylist Elena.</text>
      <text x="14" y="56" fill="#16A34A" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Reply 1 to Confirm or 2 to Reschedule</text>
      <text x="288" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="end">09:15 AM ✓✓</text>
    </g>

    <!-- Message Bubble 2: Client Reply -->
    <g transform="translate(140, 142)">
      <rect width="220" height="48" rx="12" fill="#DCFCE7"/>
      <text x="14" y="22" fill="#166534" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">1 (Confirmed! See you tomorrow!)</text>
      <text x="14" y="38" fill="#15803D" font-family="system-ui, sans-serif" font-size="9" font-weight="700">⚡ Auto-updated calendar status to Confirmed</text>
    </g>
  </g>

  <g transform="translate(75, 332)">
    <text x="0" y="12" fill="#10B981" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">✓ Reduces no-shows by up to 85% with 24h proactive WhatsApp &amp; SMS reminders</text>
  </g>
</svg>
