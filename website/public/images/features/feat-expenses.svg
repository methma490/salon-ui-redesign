<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="exp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#exp-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>

  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Expenses &amp; Daily Cash Register Drawer Balancing</text>

  <!-- Left: Drawer Balance Card -->
  <g transform="translate(75, 96)">
    <rect width="235" height="225" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="16" y="24" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Daily Cash Register Balancing</text>

    <g transform="translate(16, 42)">
      <text x="0" y="14" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Opening Cash Float:</text>
      <text x="195" y="14" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">$200.00</text>

      <text x="0" y="36" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">+ Cash Collected Today:</text>
      <text x="195" y="36" fill="#10B981" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">+$1,450.00</text>

      <text x="0" y="58" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">- Petty Cash Payouts:</text>
      <text x="195" y="58" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">-$85.00</text>

      <line x1="0" y1="72" x2="195" y2="72" stroke="#DDD6FE" stroke-width="1"/>

      <text x="0" y="92" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Expected Closing Cash:</text>
      <text x="195" y="92" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">$1,565.00</text>

      <rect x="0" y="112" width="202" height="40" rx="8" fill="#DCFCE7"/>
      <text x="101" y="128" fill="#166534" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">✓ Drawer Balanced</text>
      <text x="101" y="142" fill="#15803D" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Discrepancy: $0.00 (Perfect Match)</text>
    </g>
  </g>

  <!-- Right: Petty Cash & Expense Categories -->
  <g transform="translate(330, 96)">
    <rect width="235" height="225" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="16" y="24" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Logged Expense Categories</text>

    <!-- Expense 1 -->
    <rect x="14" y="38" width="207" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="56" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Client Coffee, Tea &amp; Milk</text>
    <text x="24" y="70" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Petty Cash • Receipt #81</text>
    <text x="210" y="62" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">-$35.00</text>

    <!-- Expense 2 -->
    <rect x="14" y="88" width="207" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="106" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Clean Towels Dry Cleaning</text>
    <text x="24" y="120" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Operations • Receipt #82</text>
    <text x="210" y="112" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">-$50.00</text>

    <!-- Expense 3 -->
    <rect x="14" y="138" width="207" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="156" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Salon High-Speed Fiber Internet</text>
    <text x="24" y="170" fill="#64748B" font-family="system-ui, sans-serif" font-size="9">Monthly Utilities</text>
    <text x="210" y="162" fill="#EF4444" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">-$89.00</text>
  </g>
</svg>
