<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="rep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF5FF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#rep-bg)"/>
  
  <rect x="50" y="40" width="540" height="320" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
  <rect x="50" y="40" width="540" height="42" rx="18" fill="#FAF5FF"/>
  <line x1="50" y1="82" x2="590" y2="82" stroke="#EDE9FE" stroke-width="1"/>

  <circle cx="78" cy="61" r="4.5" fill="#FDA4AF"/>
  <circle cx="94" cy="61" r="4.5" fill="#FCD34D"/>
  <circle cx="110" cy="61" r="4.5" fill="#86EFAC"/>
  <text x="320" y="65" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Financial Intelligence • Profit &amp; Loss (P&amp;L) Analytics</text>

  <!-- P&L Breakdown Card -->
  <g transform="translate(75, 96)">
    <rect width="490" height="150" rx="12" fill="#FAF5FF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="18" y="24" fill="#6B21A8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Monthly Salon Profit &amp; Loss Statement (MTD)</text>

    <!-- Line 1: Gross Sales -->
    <g transform="translate(18, 38)">
      <text x="0" y="14" fill="#0F172A" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Gross Service &amp; Retail Collections</text>
      <text x="450" y="14" fill="#0F172A" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">$34,800.00</text>
      <line x1="0" y1="22" x2="450" y2="22" stroke="#EDE9FE" stroke-width="1"/>
    </g>

    <!-- Line 2: Stylist Commissions -->
    <g transform="translate(18, 66)">
      <text x="0" y="14" fill="#64748B" font-family="system-ui, sans-serif" font-size="10.5">Less: Stylist Commissions &amp; Payroll</text>
      <text x="450" y="14" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">-$11,200.00</text>
      <line x1="0" y1="22" x2="450" y2="22" stroke="#EDE9FE" stroke-width="1"/>
    </g>

    <!-- Line 3: Product COGS & Overheads -->
    <g transform="translate(18, 94)">
      <text x="0" y="14" fill="#64748B" font-family="system-ui, sans-serif" font-size="10.5">Less: Back-Bar COGS, Utilities &amp; Petty Expenses</text>
      <text x="450" y="14" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">-$5,400.00</text>
      <line x1="0" y1="22" x2="450" y2="22" stroke="#DDD6FE" stroke-width="1"/>
    </g>

    <!-- Line 4: Net Operating Profit -->
    <g transform="translate(18, 122)">
      <text x="0" y="16" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Net Operating Profit (52.3% Margin)</text>
      <text x="450" y="16" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="end">+$18,200.00</text>
    </g>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(75, 260)">
    <g>
      <rect width="155" height="58" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Top Grossing Category</text>
      <text x="14" y="42" fill="#7C3AED" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Color Treatments</text>
    </g>
    <g transform="translate(168, 0)">
      <rect width="155" height="58" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="14" y="20" fill="#64748B" font-family="system-ui, sans-serif" font-size="9.5">Avg Ticket Size</text>
      <text x="14" y="42" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">$118.50</text>
    </g>
    <g transform="translate(335, 0)">
      <rect width="155" height="58" rx="10" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1"/>
      <text x="14" y="20" fill="#166534" font-family="system-ui, sans-serif" font-size="9.5">Customer Churn Rate</text>
      <text x="14" y="42" fill="#166534" font-family="system-ui, sans-serif" font-size="12" font-weight="800">4.2% (Very Low)</text>
    </g>
  </g>

  <g transform="translate(75, 334)">
    <text x="0" y="10" fill="#10B981" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">✓ Export to Excel, PDF and direct accountant tax reports with one click</text>
  </g>
</svg>
