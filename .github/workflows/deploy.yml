name: Build Images to GHCR & Deploy to CapRover

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  packages: write

# ==============================================================================
# CONFIGURATION SETTINGS
# Set these in GitHub Repo Secrets (Settings -> Secrets and variables -> Actions):
#   - CAPROVER_SERVER
#   - BACKEND_APP_NAME
#   - BACKEND_APP_TOKEN
#   - FRONTEND_APP_NAME
#   - FRONTEND_APP_TOKEN
#   - VITE_API_BASE_URL (Optional, e.g. https://api.yourdomain.com/api)
#   - WEBSITE_APP_NAME (CapRover app slug, e.g. salon-main-website)
#   - WEBSITE_APP_TOKEN (CapRover app deploy token)
#   - NEXT_PUBLIC_SITE_URL (e.g. https://salon-main-website.bc.dartcodes.com)
#   - NEXT_PUBLIC_APP_URL (salon Vite app URL for login/signup links)
#   - NEXT_PUBLIC_API_URL (optional; falls back to VITE_API_BASE_URL in build)
# ==============================================================================
env:
  # Server URL (CapRover Dashboard root)
  CAPROVER_SERVER: ${{ secrets.CAPROVER_SERVER || 'https://captain.bc.dartcodes.com' }}

  # Backend App Settings
  BACKEND_APP_NAME: ${{ secrets.BACKEND_APP_NAME || 'saloon-server' }}
  BACKEND_APP_TOKEN: ${{ secrets.BACKEND_APP_TOKEN || secrets.CAPROVER_APP_TOKEN || secrets.CAPROVER_PASSWORD || secrets.CAPROVER_TOKEN || '' }}

  # Frontend App Settings
  FRONTEND_APP_NAME: ${{ secrets.FRONTEND_APP_NAME || 'saloon-client' }}
  FRONTEND_APP_TOKEN: ${{ secrets.FRONTEND_APP_TOKEN || secrets.CAPROVER_APP_TOKEN || secrets.CAPROVER_PASSWORD || secrets.CAPROVER_TOKEN || '' }}

  # Marketing website (Next.js)
  WEBSITE_APP_NAME: ${{ secrets.WEBSITE_APP_NAME || 'salon-main-website' }}
  WEBSITE_APP_TOKEN: ${{ secrets.WEBSITE_APP_TOKEN || secrets.CAPROVER_APP_TOKEN || secrets.CAPROVER_PASSWORD || secrets.CAPROVER_TOKEN || '' }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. BUILD BACKEND DOCKER IMAGE & DEPLOY VIA GHCR
  # ----------------------------------------------------------------------------
  deploy-backend:
    name: Build & Deploy Backend (NestJS + Prisma)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables (Image Owner & Short SHA)
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/salon-backend:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/salon-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate CapRover Configuration
        run: |
          if [ -z "${{ env.CAPROVER_SERVER }}" ] || [ "${{ env.CAPROVER_SERVER }}" = "https://captain.your-domain.com" ]; then
            echo "::error::CAPROVER_SERVER is missing or set to placeholder! Please set CAPROVER_SERVER in GitHub Secrets (e.g. https://captain.yourdomain.com)."
            exit 1
          fi
          if [ -z "${{ env.BACKEND_APP_TOKEN }}" ]; then
            echo "::error::BACKEND_APP_TOKEN is missing! Go to CapRover Dashboard -> Apps -> ${{ env.BACKEND_APP_NAME }} -> Deployment tab -> Enable App Token -> copy token and add secret BACKEND_APP_TOKEN in GitHub Settings."
            exit 1
          fi

      - name: Deploy Backend Image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ env.CAPROVER_SERVER }}'
          app: '${{ env.BACKEND_APP_NAME }}'
          token: '${{ env.BACKEND_APP_TOKEN }}'
          image: 'ghcr.io/${{ env.IMAGE_OWNER }}/salon-backend:${{ env.SHORT_SHA }}'

  # ----------------------------------------------------------------------------
  # 2. BUILD FRONTEND DOCKER IMAGE & DEPLOY VIA GHCR
  # ----------------------------------------------------------------------------
  deploy-frontend:
    name: Build & Deploy Frontend (Vite + Nginx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables (Image Owner & Short SHA)
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/salon-frontend:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/salon-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate CapRover Configuration
        run: |
          if [ -z "${{ env.CAPROVER_SERVER }}" ] || [ "${{ env.CAPROVER_SERVER }}" = "https://captain.your-domain.com" ]; then
            echo "::error::CAPROVER_SERVER is missing or set to placeholder! Please set CAPROVER_SERVER in GitHub Secrets (e.g. https://captain.yourdomain.com)."
            exit 1
          fi
          if [ -z "${{ env.FRONTEND_APP_TOKEN }}" ]; then
            echo "::error::FRONTEND_APP_TOKEN is missing! Go to CapRover Dashboard -> Apps -> ${{ env.FRONTEND_APP_NAME }} -> Deployment tab -> Enable App Token -> copy token and add secret FRONTEND_APP_TOKEN in GitHub Settings."
            exit 1
          fi

      - name: Deploy Frontend Image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ env.CAPROVER_SERVER }}'
          app: '${{ env.FRONTEND_APP_NAME }}'
          token: '${{ env.FRONTEND_APP_TOKEN }}'
          image: 'ghcr.io/${{ env.IMAGE_OWNER }}/salon-frontend:${{ env.SHORT_SHA }}'

  # ----------------------------------------------------------------------------
  # 3. BUILD WEBSITE DOCKER IMAGE & DEPLOY VIA GHCR
  # ----------------------------------------------------------------------------
  deploy-website:
    name: Build & Deploy Website (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Environment Variables (Image Owner & Short SHA)
        run: |
          echo "IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve public env for Next.js build
        id: website_env
        run: |
          API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="${{ secrets.VITE_API_BASE_URL }}"
          fi
          if [ -z "$API_URL" ]; then
            API_URL="https://saloon-server.bc.dartcodes.com/api"
          fi
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

          SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://salon-main-website.bc.dartcodes.com"
          fi
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"

          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://saloon-client.bc.dartcodes.com"
          fi
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Build and Push Website Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./website
          file: ./website/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.website_env.outputs.api_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.website_env.outputs.app_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.website_env.outputs.site_url }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/salon-website:${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/salon-website:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate CapRover Configuration
        run: |
          if [ -z "${{ env.CAPROVER_SERVER }}" ] || [ "${{ env.CAPROVER_SERVER }}" = "https://captain.your-domain.com" ]; then
            echo "::error::CAPROVER_SERVER is missing or set to placeholder! Please set CAPROVER_SERVER in GitHub Secrets (e.g. https://captain.yourdomain.com)."
            exit 1
          fi
          if [ -z "${{ env.WEBSITE_APP_TOKEN }}" ]; then
            echo "::error::WEBSITE_APP_TOKEN is missing! Go to CapRover Dashboard -> Apps -> ${{ env.WEBSITE_APP_NAME }} -> Deployment tab -> Enable App Token -> copy token and add secret WEBSITE_APP_TOKEN in GitHub Settings."
            exit 1
          fi

      - name: Deploy Website Image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: '${{ env.CAPROVER_SERVER }}'
          app: '${{ env.WEBSITE_APP_NAME }}'
          token: '${{ env.WEBSITE_APP_TOKEN }}'
          image: 'ghcr.io/${{ env.IMAGE_OWNER }}/salon-website:${{ env.SHORT_SHA }}'
